[project]
name = "vimlogo"
version = "1.3.0"
description = "The classic Vim logo."
authors = [{ name = "Shay Hill", email = "shay_public@hotmail.com" }]
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "basic-colormath>=1.1.2",
    "cubic-bezier-spline>=0.21.0",
    "lxml>=6.1.1",
    "numpy>=2.4.6",
    "offset-poly>=0.5.0",
    "shapely>=2.1.2",
    "svg-ultralight>=0.109.1",
    "vec2-math>=0.7.0",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.17.0",
    "matplotlib>=3.11.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "types-lxml>=2026.2.16",
]


[tool.commitizen]
name = "cz_conventional_commits"
version = "1.3.0"
tag_format = "$version"
major-version-zero = true
version_files = ["pyproject.toml:^version"]


[tool.isort]
profile = "black"


[tool.pytest.ini_options]
addopts = "--doctest-modules"
pythonpath = "tests"
testpaths = ["tests"]
log_cli = true


[tool.ruff]
target-version = "py311"
exclude = ["typings", ".venv"]
[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "S101",
    "D",
    "F401",
] # Ignore assertions, docstrings, unused imports in test files

[tool.ruff.format]
docstring-code-line-length = 88
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
# keep isort consistent with format.skip-magic-trailing-comma
split-on-trailing-comma = false

[tool.ruff.lint]
select = ["ALL"]
# only auto-fix __all__ sorting (RUF022) and import sorting (I)
fixable = ["RUF022", "I"]
ignore = [
    "COM812",  # trailing comma missing (does not agree with Black)
    "D203",    # 1 blank line before class docstring (incompatible with D211)
    "D213",    # multi-line summary second line (incompatible with D212)
    "ISC003",  # explicitly concatenated string should be implicit
    "FLY",     # Use f-string instead of ...
    "S311",    # Standard pseudo-random generators are not suitable for security/cryptographic purposes
    "S301",    # don't use pickle
    "CPY001",  # copyrite notice should be present in each file
    "N806",    # variable in function should be lowercase
]


[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__.py"]
ignore = ["typings", ".venv"]

pythonVersion = "3.11"
pythonPlatform = "All"

typeCheckingMode = "strict"
reportCallInDefaultInitializer = true
reportImplicitStringConcatenation = true
reportPropertyTypeMismatch = true
reportUninitializedInstanceVariable = true
reportUnnecessaryTypeIgnoreComment = true
reportUnusedCallResult = true

venvPath = "."
venv = "./.venv"

[[tool.pyright.executionEnvironments]]
root = "tests"
